<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片跳转</title>
</head>
<body style="background:#0b121f;display:flex;justify-content:center;align-items:center;height:100vh;margin:0;font-family:sans-serif;">
    <div id="content"></div>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const content = document.getElementById('content');

            if (!id || !/^\d+$/.test(id.trim())) {
                content.innerHTML = '<h2 style="color:#fff;">请提供ID: ?id=数字</h2>';
                return;
            }

            const numId = parseInt(id.trim(), 10);
            if (numId < 1) {
                content.innerHTML = '<h2 style="color:#fff;">ID必须为正整数</h2>';
                return;
            }

            fetch(`/check-image?id=${numId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.url) {
                        window.location.href = data.url;
                    } else {
                        content.innerHTML = '<h2 style="color:#fff;">找不到图片</h2>';
                    }
                })
                .catch(() => {
                    content.innerHTML = '<h2 style="color:#fff;">检查失败</h2>';
                });
        })();
    </script>
</body>
</html>
