<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片跳转</title>
</head>
<body style="background:#0b121f;margin:0;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;">
    <div id="content"></div>
    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const content = document.getElementById('content');

            if (!id || !/^\d+$/.test(id.trim())) {
                content.innerHTML = '<h2 style="color:#fff;">请提供ID: ?id=数字</h2>';
                return;
            }

            const numId = parseInt(id.trim(), 10);
            if (numId < 1) {
                content.innerHTML = '<h2 style="color:#fff;">ID必须为正整数</h2>';
                return;
            }

            const extList = ['png', 'gif', 'webp', 'jpg', 'jpeg', 'jfif', 'image', 'svg', 'bmp', 'avif', 'tiff', 'tif', 'ico', 'heic', 'heif'];
            let currentIndex = 0;

            function tryImage() {
                if (currentIndex >= extList.length) {
                    content.innerHTML = '<h2 style="color:#fff;">找不到图片</h2>';
                    return;
                }

                const url = `${numId}.${extList[currentIndex]}`;
                
                fetch(url, { 
                    method: 'GET',
                    cache: 'no-store'
                })
                .then(res => {
                    // 检查响应头，如果是 HTML 则说明是回退页面
                    const contentType = res.headers.get('content-type') || '';
                    if (res.ok && !contentType.includes('text/html')) {
                        // 是图片，跳转
                        window.location.href = url;
                    } else {
                        // 是 HTML（回退页面）或不存在
                        currentIndex++;
                        tryImage();
                    }
                })
                .catch(() => {
                    currentIndex++;
                    tryImage();
                });
            }

            tryImage();
        })();
    </script>
</body>
</html>
